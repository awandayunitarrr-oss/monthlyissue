name: Update Motorcycle Issue

on:
  schedule:
    # 16:30 UTC = 23:30 WIB.
    # Tanggal 15 → rekap periode 1–15 (H1)
    - cron: "30 16 15 * *"
    # Tanggal 28–31 → dicek di step "Cek akhir bulan", hanya jalan di hari terakhir (H2)
    - cron: "30 16 28-31 * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Periode (2026-05-H1) atau rentang (2026-01-H1..2026-11-H1). Kosongkan = periode hari ini"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: motorcycle-issue
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Cek akhir bulan
        id: gate
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 16 28-31 * *" ]; then
            tomorrow=$(TZ=Asia/Jakarta date -d tomorrow +%d)
            [ "$tomorrow" = "01" ] || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Jalankan scraper: $run"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r scraper/requirements.txt

      - name: Ambil artikel
        if: steps.gate.outputs.run == 'true'
        env:
          # opsional: bila secret ini diisi, ringkasan ditulis oleh AI
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.period }}" ]; then
            python scraper/fetch_issues.py --period "${{ inputs.period }}"
          else
            python scraper/fetch_issues.py
          fi

      - name: Commit data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "motorcycle-issue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && { echo "Tidak ada perubahan"; exit 0; }
          git commit -m "data: update motorcycle issue $(TZ=Asia/Jakarta date +%Y-%m-%d)"
          git pull --rebase
          git push
    outputs:
      ran: ${{ steps.gate.outputs.run }}

  deploy:
    needs: scrape
    # jalan setelah scrape, atau langsung saat ada push ke docs/
    if: always() && (github.event_name == 'push' || needs.scrape.outputs.ran == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
